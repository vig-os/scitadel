# Managed by vigOS devkit — regenerated on upgrade; local edits are lost.
# Customize in justfile.project. Bugs / missing tools: https://github.com/vig-os/devkit/issues

# Resolve devkit toolchain (mode + image)
#
# Evolves resolve-image (#994): reads the `.vig-os` manifest and emits the
# delivery mode alongside the container image, so a leading `resolve-toolchain`
# job can drive the Option-A conditional-`container:` pattern
# (https://github.com/vig-os/devkit/blob/main/docs/rfcs/ADR-conditional-container-toolchain.md).
# The `resolve-image` action
# stays in place for now; it is retired by #991/#989.
#
# Outputs:
#   mode       devcontainer | direnv | both | bare. A manifest-bearing repo with
#              no DEVKIT_MODE key defaults to `both` — today's container
#              behavior — so un-migrated pins keep resolving.
#   image      ghcr.io/vig-os/devcontainer:<tag> for the container-ish modes
#              (devcontainer/both); an EXPLICIT EMPTY STRING for the host modes
#              (direnv/bare). Per the ADR the output is ALWAYS emitted, never
#              omitted: an empty container image makes the downstream job run on
#              the host runner.
#   image-tag  the bare resolved version tag (for logging/compat, and doubles as
#              the devkit-version to plumb into setup-devkit-toolchain's bare
#              branch).

name: Resolve devkit toolchain
description: Resolve the delivery mode + devcontainer image tag from .vig-os for mode-aware CI jobs

inputs:
  image-tag:
    description: Optional image tag override
    required: false
    default: ''
  registry-token:
    description: >-
      Optional GHCR token for authenticated manifest probes (private or
      rate-limited images). When empty, the probe runs anonymously (public
      images). Only used for the container-ish modes.
    required: false
    default: ''
  registry-username:
    description: Username paired with registry-token for docker login
    required: false
    default: ''

outputs:
  mode:
    description: Delivery mode (devcontainer|direnv|both|bare)
    value: ${{ steps.resolve.outputs.mode }}
  image:
    description: Container image (ghcr.io/... for container modes, empty string for host modes)
    value: ${{ steps.resolve.outputs.image }}
  drift-image:
    description: >-
      Devcontainer image ref for EVERY mode (empty only when no tag resolved),
      for the scaffold-drift job that `docker run`s the scaffold on the host.
      Keeps the ghcr.io/vig-os/devcontainer literal out of ci.yml (#1295).
    value: ${{ steps.resolve.outputs.drift-image }}
  image-tag:
    description: Resolved image/version tag
    value: ${{ steps.resolve.outputs.tag }}
  tag-prefix:
    description: Release tag prefix from DEVKIT_TAG_PREFIX (empty string => bare tags)
    value: ${{ steps.resolve.outputs.tag-prefix }}
  floating-tags:
    description: Floating tag levels from DEVKIT_FLOATING_TAGS (subset of major,minor; empty => off)
    value: ${{ steps.resolve.outputs.floating-tags }}
  runner-json:
    description: >-
      JSON array of runner labels from DEVKIT_CI_RUNNER (comma-separated), for
      use with fromJSON() in `runs-on`. Defaults to ["ubuntu-26.04"] when the
      key is absent.
    value: ${{ steps.resolve.outputs.runner-json }}
  dev-profile-path:
    description: >-
      Absolute dev-shell gcroot profile path from DEVKIT_DEV_PROFILE_PATH,
      plumbed into setup-devkit-toolchain's `dev-profile-path`. Empty (default)
      => the action's own `$RUNNER_TEMP/devkit-dev-profile`. A value that cannot
      persist (relative, or inside the runner's `_work` tree) fails here, before
      any lane realises the dev-shell (#1601).
    value: ${{ steps.resolve.outputs.dev-profile-path }}
  refs-optional-types:
    description: >-
      Comma-separated commit types whose Refs line is optional, for
      validate-commit-range. DEVKIT_REFS_OPTIONAL_TYPES names the set
      directly and wins; otherwise DEVKIT_REFS_POLICY maps to `chore`
      (default/absent), the resolved commit-types list (`optional`), or the
      `none` sentinel (`required`).
    value: ${{ steps.resolve.outputs.refs-optional-types }}
  commit-types:
    description: >-
      Comma-separated approved commit types from DEVKIT_COMMIT_TYPES for
      validate-commit-range's `--types`. The stock 11-type list when the key
      is absent/empty (or carries an out-of-charset value — fail-safe, the
      loud guard lives at the scaffold write path).
    value: ${{ steps.resolve.outputs.commit-types }}
  branch-types:
    description: >-
      Comma-separated issue-numbered branch types from DEVKIT_BRANCH_TYPES for
      the commit-checks branch-name gate. The stock set when the key is
      absent/empty (or carries an out-of-charset value — fail-safe, the loud
      guard lives at the scaffold write path).
    value: ${{ steps.resolve.outputs.branch-types }}
  drift-check:
    description: >-
      Scaffold-drift gate toggle from DEVKIT_DRIFT_CHECK: `true` (default/absent)
      keeps ci.yml's scaffold-drift job enabled, `false` self-skips it. Emitted
      for every mode so the job's `if:` can gate on it with no re-scaffold.
    value: ${{ steps.resolve.outputs.drift-check }}
  languages:
    description: >-
      Comma-separated project languages DECLARED in DEVKIT_LANGUAGES, for the
      ci.yml gate that fails when a declared language's marker file is gone. An
      EXPLICIT EMPTY STRING when the key is absent/empty (nothing declared), so
      a language-neutral repo — and any consumer predating the key — stays green.
    value: ${{ steps.resolve.outputs.languages }}

runs:
  using: composite
  steps:
    - name: Resolve mode + image tag
      id: resolve
      shell: bash
      env:
        INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail

        MODE=""
        DEVKIT_VERSION=""
        LEGACY_VERSION=""
        TAG_PREFIX=""
        FLOATING_TAGS=""
        CI_RUNNER=""
        DEV_PROFILE_PATH=""
        REFS_POLICY=""
        REFS_OPTIONAL_TYPES_RAW=""
        COMMIT_TYPES=""
        BRANCH_TYPES=""
        DRIFT_CHECK=""
        LANGUAGES=""

        if [[ -f .vig-os ]]; then
          # Tolerant KEY=VALUE parsing shared with resolve-image (#781): capture
          # DEVKIT_MODE and both version keys, preferring the renamed
          # DEVKIT_VERSION over the legacy DEVCONTAINER_VERSION after the read so
          # line order never matters.
          while IFS= read -r line || [[ -n "${line:-}" ]]; do
            [[ -z "${line//[[:space:]]/}" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            case "$line" in
              DEVKIT_MODE=*|DEVKIT_VERSION=*|DEVCONTAINER_VERSION=*|DEVKIT_TAG_PREFIX=*|DEVKIT_FLOATING_TAGS=*|DEVKIT_CI_RUNNER=*|DEVKIT_DEV_PROFILE_PATH=*|DEVKIT_REFS_POLICY=*|DEVKIT_REFS_OPTIONAL_TYPES=*|DEVKIT_COMMIT_TYPES=*|DEVKIT_BRANCH_TYPES=*|DEVKIT_DRIFT_CHECK=*|DEVKIT_LANGUAGES=*)
                key="${line%%=*}"
                value="${line#*=}"
                value="${value#"${value%%[![:space:]]*}"}"
                value="${value%"${value##*[![:space:]]}"}"

                if [[ "$value" =~ ^\".*\"$ ]]; then
                  value="${value:1:-1}"
                elif [[ "$value" =~ ^\'.*\'$ ]]; then
                  value="${value:1:-1}"
                fi

                case "$key" in
                  DEVKIT_MODE) MODE="$value" ;;
                  DEVKIT_VERSION) DEVKIT_VERSION="$value" ;;
                  DEVCONTAINER_VERSION) LEGACY_VERSION="$value" ;;
                  DEVKIT_TAG_PREFIX) TAG_PREFIX="$value" ;;
                  DEVKIT_FLOATING_TAGS) FLOATING_TAGS="$value" ;;
                  DEVKIT_CI_RUNNER) CI_RUNNER="$value" ;;
                  DEVKIT_DEV_PROFILE_PATH) DEV_PROFILE_PATH="$value" ;;
                  DEVKIT_REFS_POLICY) REFS_POLICY="$value" ;;
                  DEVKIT_REFS_OPTIONAL_TYPES) REFS_OPTIONAL_TYPES_RAW="$value" ;;
                  DEVKIT_COMMIT_TYPES) COMMIT_TYPES="$value" ;;
                  DEVKIT_BRANCH_TYPES) BRANCH_TYPES="$value" ;;
                  DEVKIT_DRIFT_CHECK) DRIFT_CHECK="$value" ;;
                  DEVKIT_LANGUAGES) LANGUAGES="$value" ;;
                esac
                ;;
            esac
          done < .vig-os
        fi

        # Missing DEVKIT_MODE defaults to `both` (today's container behavior).
        MODE="${MODE:-both}"

        # Refuse an unknown/corrupt mode loudly (mirrors the init-workspace.sh
        # persisted-mode guard): a typo'd value must never be silently
        # classified as a host mode and flip a container repo's CI onto host
        # runners.
        case "$MODE" in
          devcontainer|direnv|both|bare) ;;
          *)
            echo "::error::Invalid DEVKIT_MODE in .vig-os: $MODE (expected: devcontainer | direnv | both | bare)"
            exit 1
            ;;
        esac
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"

        # Release tag prefix (#1044): freeform, empty by default (= bare tags).
        # Emitted for every mode; only the release/promote workflows consume it,
        # composing it onto tag names/URLs at the publishing edge.
        echo "tag-prefix=$TAG_PREFIX" >> "$GITHUB_OUTPUT"

        # Floating tag levels (#1045): comma-separated subset of major,minor;
        # empty by default (= off). Only promote-release consumes it, force-moving
        # <prefix>X / <prefix>X.Y at the final release commit.
        echo "floating-tags=$FLOATING_TAGS" >> "$GITHUB_OUTPUT"

        # CI runner labels (#1173): DEVKIT_CI_RUNNER is a comma-separated label
        # list routed into `runs-on` via fromJSON() by the downstream CI
        # jobs. Absent => the hosted default, so existing consumers are unchanged.
        # Emitted for every mode, ALWAYS a valid JSON array (single label =>
        # ["ubuntu-26.04"]); whitespace around each label is trimmed and empty
        # entries dropped so a trailing/spaced comma never yields a blank label.
        CI_RUNNER="${CI_RUNNER:-ubuntu-26.04}"
        RUNNER_JSON="["
        runner_first=1
        IFS=',' read -ra runner_labels <<< "$CI_RUNNER"
        for label in "${runner_labels[@]}"; do
          label="${label#"${label%%[![:space:]]*}"}"
          label="${label%"${label##*[![:space:]]}"}"
          [[ -z "$label" ]] && continue
          if [[ "$runner_first" -eq 1 ]]; then runner_first=0; else RUNNER_JSON+=","; fi
          RUNNER_JSON+="\"$label\""
        done
        # An all-blank value (e.g. DEVKIT_CI_RUNNER=" ,") falls back to the default.
        [[ "$runner_first" -eq 1 ]] && RUNNER_JSON+="\"ubuntu-26.04\""
        RUNNER_JSON+="]"
        echo "runner-json=$RUNNER_JSON" >> "$GITHUB_OUTPUT"

        # Dev-shell gcroot profile path (#1601): DEVKIT_DEV_PROFILE_PATH moves
        # the direnv dev-shell's gcroot out of RUNNER_TEMP, which an ephemeral
        # self-hosted runner wipes between jobs while its /nix/store persists —
        # leaving the closure every CI run needs unrooted and collectable by the
        # host's nix.gc. Absent/empty => the toolchain action's own RUNNER_TEMP
        # default, so every existing consumer is unchanged.
        #
        # Vetted HERE, once, on the hosted producer job: a value no host could
        # make persistent is a manifest typo, and catching it after three
        # toolchain lanes have each realised a dev-shell helps nobody. What only
        # the target host can answer — is the directory there, is it writable —
        # stays in the action's step. Neither may fall back silently: a
        # job-scoped gcroot is indistinguishable from the bug.
        DEV_PROFILE_PATH_RAW="$DEV_PROFILE_PATH"
        # Trim trailing slashes: `--profile /a/b/` and `/a/b` name the same
        # gcroot, and the step takes `dirname` of the value.
        DEV_PROFILE_PATH="${DEV_PROFILE_PATH%"${DEV_PROFILE_PATH##*[!/]}"}"
        if [[ -n "$DEV_PROFILE_PATH" ]]; then
          if [[ "$DEV_PROFILE_PATH" != /* ]]; then
            echo "::error::Invalid DEVKIT_DEV_PROFILE_PATH in .vig-os: $DEV_PROFILE_PATH (must be an ABSOLUTE path — a relative one resolves against the checkout, which the runner wipes between jobs)"
            exit 1
          fi
          # `_work` is the runner's work-tree root and `_temp` its RUNNER_TEMP
          # leaf — both runner-internal names, and both wiped between ephemeral
          # jobs. GITHUB_WORKSPACE lives under `_work` too. This catches the
          # mistake the knob exists to prevent (rooting inside the very tree the
          # runner clears); it cannot prove an arbitrary path is persistent, and
          # does not try to.
          case "$DEV_PROFILE_PATH" in
            */_work/*|*/_work|*/_temp/*|*/_temp)
              echo "::error::Invalid DEVKIT_DEV_PROFILE_PATH in .vig-os: $DEV_PROFILE_PATH (inside the runner's own work tree — RUNNER_TEMP and GITHUB_WORKSPACE both live there and are wiped between jobs). Point it at a persistent directory outside the runner workspace, e.g. /var/lib/devkit/gcroots/dev-profile"
              exit 1
              ;;
          esac
        elif [[ -n "${DEV_PROFILE_PATH_RAW:-}" ]]; then
          # Only reachable for a value that was nothing but slashes ("/"), which
          # the trim above empties: a gcroot cannot be the filesystem root.
          echo "::error::Invalid DEVKIT_DEV_PROFILE_PATH in .vig-os: $DEV_PROFILE_PATH_RAW (must name a profile path, not the filesystem root)"
          exit 1
        fi
        echo "dev-profile-path=$DEV_PROFILE_PATH" >> "$GITHUB_OUTPUT"

        # Commit types (#1431): resolve DEVKIT_COMMIT_TYPES into the --types
        # list validate-commit-range consumes in the commit-checks job. This is
        # the single mapping point for the CI surface; it MIRRORS
        # render_commit_types in assets/init-workspace.sh (two renderers, one
        # key — keep in lockstep). The loud charset guard lives at the write
        # path (init-workspace.sh); here an out-of-charset entry falls back to
        # the stock list with a warning (fail-safe: a broken value must never
        # break — or weaken — the gate). Whitespace around entries is trimmed
        # and empty entries dropped, matching the runner-label parsing above.
        DEFAULT_COMMIT_TYPES="feat,fix,docs,chore,refactor,perf,test,ci,build,revert,style"
        RESOLVED_COMMIT_TYPES=""
        if [[ -n "$COMMIT_TYPES" ]]; then
          commit_types_valid=1
          IFS=',' read -ra type_entries <<< "$COMMIT_TYPES"
          for entry in "${type_entries[@]}"; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [[ -z "$entry" ]] && continue
            if [[ ! "$entry" =~ ^[a-z][a-z0-9]*$ ]]; then
              commit_types_valid=0
              break
            fi
            RESOLVED_COMMIT_TYPES+="${RESOLVED_COMMIT_TYPES:+,}$entry"
          done
          if [[ "$commit_types_valid" -ne 1 ]]; then
            echo "::warning::Invalid DEVKIT_COMMIT_TYPES in .vig-os ('$COMMIT_TYPES'); falling back to the default approved types."
            RESOLVED_COMMIT_TYPES=""
          fi
        fi
        # An all-blank value falls back to the default (like DEVKIT_CI_RUNNER).
        RESOLVED_COMMIT_TYPES="${RESOLVED_COMMIT_TYPES:-$DEFAULT_COMMIT_TYPES}"
        echo "commit-types=$RESOLVED_COMMIT_TYPES" >> "$GITHUB_OUTPUT"

        # Branch types (#1432): resolve DEVKIT_BRANCH_TYPES into the
        # issue-numbered type set the commit-checks branch-name gate consumes.
        # Single mapping point for the CI surface; MIRRORS render_branch_types
        # in assets/init-workspace.sh (two renderers, one key — keep in
        # lockstep). Same guard philosophy as commit-types above: the loud
        # charset guard lives at the write path, here an out-of-charset entry
        # falls back to the stock set with a warning (fail-safe: a broken
        # value must never break — or weaken — the gate).
        DEFAULT_BRANCH_TYPES="feature,bugfix,hotfix,release,docs,test,refactor"
        RESOLVED_BRANCH_TYPES=""
        if [[ -n "$BRANCH_TYPES" ]]; then
          branch_types_valid=1
          IFS=',' read -ra btype_entries <<< "$BRANCH_TYPES"
          for entry in "${btype_entries[@]}"; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [[ -z "$entry" ]] && continue
            if [[ ! "$entry" =~ ^[a-z][a-z0-9]*$ ]]; then
              branch_types_valid=0
              break
            fi
            RESOLVED_BRANCH_TYPES+="${RESOLVED_BRANCH_TYPES:+,}$entry"
          done
          if [[ "$branch_types_valid" -ne 1 ]]; then
            echo "::warning::Invalid DEVKIT_BRANCH_TYPES in .vig-os ('$BRANCH_TYPES'); falling back to the default branch types."
            RESOLVED_BRANCH_TYPES=""
          fi
        fi
        # An all-blank value falls back to the default (like DEVKIT_CI_RUNNER).
        RESOLVED_BRANCH_TYPES="${RESOLVED_BRANCH_TYPES:-$DEFAULT_BRANCH_TYPES}"
        echo "branch-types=$RESOLVED_BRANCH_TYPES" >> "$GITHUB_OUTPUT"

        # Refs policy (#1282): map DEVKIT_REFS_POLICY to the --refs-optional-types
        # list validate-commit-range consumes in the commit-checks job. This is
        # the single mapping point for the CI surface; it MIRRORS render_refs_policy
        # in assets/init-workspace.sh (two renderers, one key — keep in lockstep).
        # The loud enum guard lives at the write path (init-workspace.sh); here an
        # unexpected/absent value defaults safely to `chore` (today's behavior) so
        # CI never breaks on a surprise literal. `optional` mirrors the RESOLVED
        # commit-types list above — the custom DEVKIT_COMMIT_TYPES when set
        # (#1431), else the stock 11 — so the gate never requires Refs for a type
        # it just accepted. `required` uses a `none` sentinel type (no real commit
        # is type `none`) because an empty list is parsed as falsy by the tool and
        # reverts to the {chore} default.
        case "$REFS_POLICY" in
          optional) REFS_OPTIONAL_TYPES="$RESOLVED_COMMIT_TYPES" ;;
          required) REFS_OPTIONAL_TYPES="none" ;;
          *)        REFS_OPTIONAL_TYPES="chore" ;;
        esac

        # Refs-optional types (#1633): DEVKIT_REFS_OPTIONAL_TYPES names the
        # exempt set directly and WINS over the policy enum above — the
        # documented precedence, mirrored in init-workspace.sh and
        # nix/hooks.nix (three renderers, one resolution). Same guard
        # philosophy as commit-types/branch-types: the loud guard (charset AND
        # subset-of-approved-types) lives at the write path, and here a bad
        # value falls back with a warning rather than failing the job. But
        # fail-safe for an EXEMPTION list means the SMALLEST set, not the stock
        # mapping: falling back to `optional` would switch the Refs gate off
        # for every type because the narrower key had a typo. So the fallback
        # clamps to `chore` unless the policy is already narrower (`none`).
        # This is the one place the #1431 commit-types analogy inverts — there
        # the stock list is a subset of any sane custom one, here it is not.
        if [[ -n "$REFS_OPTIONAL_TYPES_RAW" ]]; then
          resolved_refs_optional=""
          refs_optional_valid=1
          IFS=',' read -ra refs_optional_entries <<< "$REFS_OPTIONAL_TYPES_RAW"
          for entry in "${refs_optional_entries[@]}"; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [[ -z "$entry" ]] && continue
            if [[ ! "$entry" =~ ^[a-z][a-z0-9]*$ ]] \
              || [[ ",$RESOLVED_COMMIT_TYPES," != *",$entry,"* ]]; then
              refs_optional_valid=0
              break
            fi
            resolved_refs_optional+="${resolved_refs_optional:+,}$entry"
          done
          if [[ "$refs_optional_valid" -ne 1 ]]; then
            [[ "$REFS_OPTIONAL_TYPES" != "none" ]] && REFS_OPTIONAL_TYPES="chore"
            echo "::warning::Invalid DEVKIT_REFS_OPTIONAL_TYPES in .vig-os ('$REFS_OPTIONAL_TYPES_RAW'); falling back to '$REFS_OPTIONAL_TYPES' (an invalid exemption list never relaxes the gate)."
          elif [[ -n "$resolved_refs_optional" ]]; then
            REFS_OPTIONAL_TYPES="$resolved_refs_optional"
          fi
        fi
        echo "refs-optional-types=$REFS_OPTIONAL_TYPES" >> "$GITHUB_OUTPUT"

        # Scaffold-drift gate (#1295): DEVKIT_DRIFT_CHECK toggles ci.yml's
        # scaffold-drift job. Absent/empty => `true` (enabled), so existing
        # consumers gain the gate on adoption; only an explicit `false` disables
        # it. Emitted for every mode; the loud value guard lives at the write path
        # (init-workspace.sh), so any non-`false` literal here defaults to enabled
        # (fail-safe: the drift check runs). The job self-skips on `false` via its
        # `if:`, so flipping the knob needs no re-scaffold.
        DRIFT_CHECK="${DRIFT_CHECK:-true}"
        [[ "$DRIFT_CHECK" == "false" ]] || DRIFT_CHECK="true"
        echo "drift-check=$DRIFT_CHECK" >> "$GITHUB_OUTPUT"

        # Declared languages (#1478): DEVKIT_LANGUAGES is the repo's own
        # statement of which language projects it carries — a DECLARATION the
        # scaffold seeds and only ever grows, never a detection cache. Normalize
        # only (trim each entry, drop empties); the enum guard lives at the write
        # path (init-workspace.sh) and the ci.yml gate skips a name it cannot map
        # to a marker, so a surprise literal warns instead of breaking CI.
        # Emitted for every mode, ALWAYS (an explicit empty string when nothing
        # is declared) so the gate can treat empty as "nothing to assert".
        RESOLVED_LANGUAGES=""
        if [[ -n "$LANGUAGES" ]]; then
          IFS=',' read -ra language_entries <<< "$LANGUAGES"
          for entry in "${language_entries[@]}"; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [[ -z "$entry" ]] && continue
            RESOLVED_LANGUAGES+="${RESOLVED_LANGUAGES:+,}$entry"
          done
        fi
        echo "languages=$RESOLVED_LANGUAGES" >> "$GITHUB_OUTPUT"

        # Resolve the version tag: explicit override wins, else DEVKIT_VERSION,
        # else the legacy DEVCONTAINER_VERSION.
        TAG="$INPUT_IMAGE_TAG"
        if [[ -z "$TAG" ]]; then
          TAG="${DEVKIT_VERSION:-$LEGACY_VERSION}"
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

        case "$MODE" in
          devcontainer|both)
            # Container-ish modes need a resolvable tag to build the image ref.
            if [[ -z "$TAG" ]]; then
              echo "::error::Could not resolve DEVKIT_VERSION (or legacy DEVCONTAINER_VERSION) from .vig-os and no image-tag override was provided (mode=$MODE)."
              exit 1
            fi
            IMAGE="ghcr.io/vig-os/devcontainer:${TAG}"
            ;;
          direnv|bare)
            # Host modes: no container image. Emit an EXPLICIT empty string
            # (never omit) so the downstream `container:` runs on the host
            # (ADR Option A). Explicit arm — unknown modes were rejected above,
            # so the statement is closed.
            IMAGE=""
            ;;
        esac
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

        # Scaffold-drift image (#1295): the devcontainer image ref for EVERY mode
        # (empty only when no tag resolved). Unlike `image` above — which is an
        # explicit empty string for host modes so downstream `container:` runs on
        # the host — the scaffold-drift job `docker run`s the image itself (the
        # scaffold assets live only in the image, and a direnv/bare consumer's
        # jobs otherwise never pull it). Emitting the ref here keeps the
        # `ghcr.io/vig-os/devcontainer` literal out of the scaffolded ci.yml (the
        # #991 single-source-of-truth invariant).
        DRIFT_IMAGE=""
        [[ -n "$TAG" ]] && DRIFT_IMAGE="ghcr.io/vig-os/devcontainer:${TAG}"
        echo "drift-image=$DRIFT_IMAGE" >> "$GITHUB_OUTPUT"
        echo "Resolved mode=$MODE tag=${TAG:-<none>} image=${IMAGE:-<host>}"

    - name: Validate image accessibility
      # Only the container-ish modes emit a non-empty image; host modes skip the
      # probe entirely (no image needed).
      if: steps.resolve.outputs.image != ''
      shell: bash
      env:
        IMAGE: ${{ steps.resolve.outputs.image }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
      run: |
        set -euo pipefail
        echo "Validating image availability: $IMAGE"

        # Authenticate before the probe when a token is supplied, so private or
        # rate-limited images resolve. The anonymous path is kept for public
        # images (empty token).
        if [[ -n "$REGISTRY_TOKEN" ]]; then
          echo "Authenticating to ghcr.io as '${REGISTRY_USERNAME}'"
          if ! echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin; then
            echo "::error::Failed to authenticate to ghcr.io as '${REGISTRY_USERNAME}'. Check the GHCR_PULL_TOKEN secret and that it grants packages:read."
            exit 1
          fi
        fi

        # Do not swallow stderr: capture it so an auth/denied failure can be
        # distinguished from a genuinely missing tag.
        if ! PROBE_ERR="$(docker manifest inspect "$IMAGE" 2>&1 >/dev/null)"; then
          echo "$PROBE_ERR"
          if echo "$PROBE_ERR" | grep -qiE 'unauthorized|denied|authentication|forbidden|toomanyrequests|rate limit'; then
            echo "::error::Cannot access image manifest: ${IMAGE} — authentication required or denied. Set the GHCR_PULL_TOKEN secret (or grant the workflow token packages:read) and pass it to this action."
          else
            echo "::error::Cannot access image manifest: ${IMAGE} — the tag does not exist or is not readable. Check that DEVKIT_VERSION (or legacy DEVCONTAINER_VERSION) in .vig-os points at a published image tag."
          fi
          exit 1
        fi
