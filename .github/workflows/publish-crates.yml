# Publish scitadel workspace crates to crates.io in dependency order.
#
# Release-train wiring (devkit 1.6.0). Before the migration this fired on the
# tag push that release-please created. Under the devkit train a final tag is
# pushed while its GitHub Release is still a DRAFT, and the release only becomes
# real when promote-release.yml publishes it — so the live publish now hangs off
# `release: published`. crates.io is irreversible: a version published from a
# draft that later gets rolled back could never be re-cut, so waiting for the
# promote is the safe edge. Publishing lands a minute or two after promote
# instead of at tag time; nothing downstream depends on the ordering.
#
# The always-on dry-run stays on PRs so breakage surfaces on the branch.
# `release-extension.yml` re-runs the same checks at the finalized release SHA,
# blocking the tag before it is cut (see docs/DOWNSTREAM_RELEASE.md, "Extension
# Hook"); this file owns the live publish, which needs a registry secret and an
# `environment:` approval gate the read-only seam must not carry.
#
# Each step is idempotent against crates.io — an already-published version is
# skipped, so a re-dispatch after a partial failure is safe.
#
# SETUP (one-time, manual): create a crates.io API token at
# https://crates.io/me and add it as repository secret CARGO_REGISTRY_TOKEN
# (environment `crates-io`). Until then, the auth step fails with a clear error.

name: Publish crates

on:  # yamllint disable-line rule:truthy
  release:
    types: [published]
  pull_request:
    branches: [dev, main]
  # Manual retry for an already-published release (e.g. a transient
  # registry/index failure part-way through the sequential publish).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish crates from (e.g. 0.7.0)"
        required: true

permissions:
  contents: read

jobs:
  # Always-on dry-run so breakage surfaces on PRs, not only at release time.
  dry-run:
    name: cargo publish --dry-run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check every crate has publishable metadata
        # cargo-manifest-level check that each workspace crate has the
        # required crates.io metadata fields. Does NOT hit the registry,
        # so it works for internal deps that aren't yet published.
        run: |
          set -euo pipefail
          missing=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[]
                     | . as $p
                     | ["description", "license", "repository"][]
                     | select(($p[.] // "") == "")
                     | "  - \($p.name): missing \(.)"')
          if [ -n "$missing" ]; then
            echo "Missing publish metadata:"
            printf '%s\n' "$missing"
            exit 1
          fi
          echo "All workspace crates carry the required publish metadata."

      - name: Dry-run publish (leaf crate only)
        # Full --dry-run on the leaf catches upload-shape issues for the one
        # crate that has no internal deps. Downstream crates can only be
        # fully dry-run after their upstreams exist on crates.io; we rely
        # on the real sequential publish at release time to surface those.
        run: cargo publish --dry-run --allow-dirty -p scitadel-core

  # Live publish runs only for a published (non-pre-release) GitHub Release, or
  # an explicit re-dispatch. Sequential and ordered; we sleep briefly between
  # crates so the crates.io index has time to catch up.
  publish:
    name: Publish to crates.io
    if: >-
      (github.event_name == 'release' && github.event.release.prerelease == false)
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify CARGO_REGISTRY_TOKEN is set
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. Add a repo secret first."
            exit 1
          fi

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          publish_one() {
            local crate="$1"
            echo "::group::Publishing $crate"
            if cargo publish -p "$crate" 2>&1 | tee /tmp/publish.log; then
              echo "$crate published"
            elif grep -q "already exists" /tmp/publish.log; then
              echo "$crate version already published — skipping"
            else
              echo "::error::$crate publish failed"
              exit 1
            fi
            echo "::endgroup::"
            sleep 20  # index propagation
          }
          for crate in scitadel-core scitadel-db scitadel-adapters \
                       scitadel-scoring scitadel-export \
                       scitadel-mcp scitadel-tui scitadel-cli; do
            publish_one "$crate"
          done
