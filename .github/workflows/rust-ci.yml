name: Rust CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main, dev, "rust-rewrite*"]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every job reads the channel + components from the repo-root
  # `rust-toolchain.toml` (#229): dtolnay/rust-toolchain@master with no
  # `toolchain:` input auto-detects that file, so the same version resolves
  # here and under `nix develop`. The `rustup show` step prints the resolved
  # toolchain into the log so a drift is visible at a glance.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      - run: rustup show active-toolchain && rustc --version && cargo clippy --version
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      - run: rustup show active-toolchain && rustc --version
      - run: cargo test --workspace

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      - run: rustup show active-toolchain && rustc --version
      - run: cargo test --workspace --features contract-tests
