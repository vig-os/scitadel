# Managed by vigOS devkit — regenerated on upgrade; local edits are lost.
# Customize in justfile.project. Bugs / missing tools: https://github.com/vig-os/devkit/issues

name: Release Core

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      version:
        description: "Semantic version to release (e.g., 1.2.3)"
        required: true
        type: string
      release_kind:
        description: "Release mode: candidate publishes X.Y.Z-rcN, final publishes X.Y.Z"
        required: false
        default: "candidate"
        type: string
      dry_run:
        description: "Validate without making changes"
        required: false
        default: false
        type: boolean
      git_user_name:
        description: "Git user name for release commits"
        required: false
        default: "github-actions[bot]"
        type: string
      git_user_email:
        description: "Git user email for release commits"
        required: false
        default: "41898282+github-actions[bot]@users.noreply.github.com"
        type: string
      rc_number:
        description: "Candidate RC index (e.g. 21 for X.Y.Z-rc21). Omit to auto-increment from existing tags."
        required: false
        default: ""
        type: string
      toolchain_mode:
        description: "Delivery mode resolved by the orchestrator (devcontainer|direnv|both|bare)"
        required: true
        type: string
      toolchain_image:
        description: "Container image resolved by the orchestrator (empty string => host runner)"
        required: false
        default: ""
        type: string
      devkit_version:
        description: "Resolved devkit/image version pin (bare-mode vig-utils install; logging)"
        required: false
        default: ""
        type: string
      tag_prefix:
        description: "Release tag prefix (DEVKIT_TAG_PREFIX); empty => bare X.Y.Z tags"
        required: false
        default: ""
        type: string
    secrets:
      token:
        required: false
      # Passed by the caller via `secrets: inherit`; a workflow_call workflow has
      # a closed secrets set, so every secret it reads must be declared here.
      GHCR_PULL_TOKEN:
        description: "GHCR read token for the container image (falls back to github.token)"
        required: false
      RELEASE_APP_CLIENT_ID:
        description: "GitHub App client ID used to mint the release token"
        required: true
      RELEASE_APP_PRIVATE_KEY:
        description: "GitHub App private key used to mint the release token"
        required: true
      COMMIT_APP_CLIENT_ID:
        description: "GitHub App client ID used to mint the verified-commit token"
        required: true
      COMMIT_APP_PRIVATE_KEY:
        description: "GitHub App private key used to mint the verified-commit token"
        required: true
    outputs:
      version:
        description: "Resolved release version"
        value: ${{ jobs.validate.outputs.version }}
      pr_number:
        description: "Release PR number"
        value: ${{ jobs.validate.outputs.pr_number }}
      release_date:
        description: "UTC release date used for finalization"
        value: ${{ jobs.validate.outputs.release_date }}
      pre_finalize_sha:
        description: "Release branch SHA before finalization"
        value: ${{ jobs.validate.outputs.pre_finalize_sha }}
      release_kind:
        description: "Release kind (candidate or final)"
        value: ${{ jobs.validate.outputs.release_kind }}
      publish_version:
        description: "Tag to publish (X.Y.Z or X.Y.Z-rcN)"
        value: ${{ jobs.validate.outputs.publish_version }}
      finalize_sha:
        description: "Release branch SHA after finalization"
        value: ${{ jobs.finalize.outputs.finalize_sha }}
      tag_already_exists:
        description: "Remote publish tag already exists at finalize SHA (retry path)"
        value: ${{ jobs.finalize.outputs.tag_already_exists }}
      image_tag:
        description: "Resolved devcontainer image tag"
        value: ${{ inputs.devkit_version }}

concurrency:
  group: release-core
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: Validate Release Core
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      packages: read
    # Conditional container (ADR Option A): the orchestrator-resolved image is
    # empty in the host modes, so this job runs on the runner there; the GHCR
    # credentials block is inert on an empty image.
    container:
      image: ${{ inputs.toolchain_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.vars.outputs.version }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      release_date: ${{ steps.vars.outputs.release_date }}
      pre_finalize_sha: ${{ steps.pre_sha.outputs.pre_finalize_sha }}
      release_kind: ${{ steps.vars.outputs.release_kind }}
      publish_version: ${{ steps.publish_meta.outputs.publish_version }}

    steps:
      - name: Generate release app token
        id: release_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Resolve auth token
        id: auth
        env:
          PROVIDED_TOKEN: ${{ secrets.token }}
          FALLBACK_TOKEN: ${{ steps.release_app_token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -n "${PROVIDED_TOKEN:-}" ]; then
            echo "token=$PROVIDED_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "token=$FALLBACK_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and prepare variables
        id: vars
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_KIND: ${{ inputs.release_kind }}
        run: |
          set -euo pipefail
          VERSION="$INPUT_VERSION"
          RELEASE_KIND="$INPUT_RELEASE_KIND"

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Invalid version format '$VERSION'"
            echo "Version must follow semantic versioning: MAJOR.MINOR.PATCH (e.g., 1.2.3)"
            exit 1
          fi
          if [ "$RELEASE_KIND" != "candidate" ] && [ "$RELEASE_KIND" != "final" ]; then
            echo "ERROR: Invalid release-kind '$RELEASE_KIND'"
            echo "release-kind must be one of: candidate, final"
            exit 1
          fi

          RELEASE_DATE=$(date -u +%Y-%m-%d)
          {
            echo "version=$VERSION"
            echo "release_kind=$RELEASE_KIND"
            echo "release_date=$RELEASE_DATE"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: release/${{ steps.vars.outputs.version }}
          fetch-depth: 0
          token: ${{ steps.auth.outputs.token }}

      - name: Set up devkit toolchain
        uses: ./.github/actions/setup-devkit-toolchain
        with:
          mode: ${{ inputs.toolchain_mode }}
          devkit-version: ${{ inputs.devkit_version }}

      - name: Record pre-finalization SHA
        id: pre_sha
        run: |
          PRE_FINALIZE_SHA=$(git rev-parse HEAD)
          echo "pre_finalize_sha=$PRE_FINALIZE_SHA" >> "$GITHUB_OUTPUT"
          echo "Pre-finalization SHA: $PRE_FINALIZE_SHA"

      - name: Verify CHANGELOG has TBD entry
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          if ! grep -Fq "## [$VERSION] - TBD" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md does not contain '## [$VERSION] - TBD'"
            exit 1
          fi

      - name: Compute publish version
        id: publish_meta
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          RELEASE_KIND: ${{ steps.vars.outputs.release_kind }}
          INPUT_RC_NUMBER: ${{ inputs.rc_number }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          # publish_version stays BARE (X.Y.Z / X.Y.Z-rcN); the tag prefix is
          # composed only when discovering/emitting a tag NAME (#1044).
          NEXT_RC=""
          if [ "$RELEASE_KIND" = "candidate" ]; then
            if [ -n "${INPUT_RC_NUMBER}" ]; then
              if ! printf '%s' "${INPUT_RC_NUMBER}" | grep -qE '^[0-9]+$'; then
                echo "ERROR: rc_number must be a positive integer (got '${INPUT_RC_NUMBER}')"
                exit 1
              fi
              if [ "${INPUT_RC_NUMBER}" -lt 1 ]; then
                echo "ERROR: rc_number must be >= 1 (got '${INPUT_RC_NUMBER}')"
                exit 1
              fi
              NEXT_RC="${INPUT_RC_NUMBER}"
              PUBLISH_VERSION="${VERSION}-rc${NEXT_RC}"
              echo "Using explicit rc_number=$NEXT_RC -> publish_version=$PUBLISH_VERSION"
            else
              # Discover existing RC tags under the prefixed tag name, e.g. v1.2.3-rc*.
              TAG_PATTERN="${TAG_PREFIX}${VERSION}-rc*"
              EXISTING_TAGS=$(git ls-remote --tags --refs origin "$TAG_PATTERN" | awk '{print $2}' | sed 's#refs/tags/##')

              MAX_RC=0
              if [ -n "$EXISTING_TAGS" ]; then
                while IFS= read -r tag; do
                  [ -z "$tag" ] && continue
                  if [ "${tag#"${TAG_PREFIX}${VERSION}"-rc}" = "$tag" ]; then
                    echo "ERROR: Malformed candidate tag detected: $tag"
                    echo "Expected format: ${TAG_PREFIX}${VERSION}-rcN"
                    exit 1
                  fi
                  rc_num="${tag#"${TAG_PREFIX}${VERSION}"-rc}"
                  if ! echo "$rc_num" | grep -qE '^[0-9]+$'; then
                    echo "ERROR: Malformed candidate tag detected: $tag"
                    echo "Expected format: ${TAG_PREFIX}${VERSION}-rcN"
                    exit 1
                  fi
                  if [ "$rc_num" -gt "$MAX_RC" ]; then
                    MAX_RC="$rc_num"
                  fi
                done <<< "$EXISTING_TAGS"
              fi

              NEXT_RC=$((MAX_RC + 1))
              PUBLISH_VERSION="${VERSION}-rc${NEXT_RC}"
            fi
          else
            PUBLISH_VERSION="$VERSION"
          fi
          echo "publish_version=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_rc=$NEXT_RC" >> "$GITHUB_OUTPUT"

      # Remote tag vs finalize SHA is validated in the finalize job (tag_state) after finalize_sha is known.

      - name: Find and verify PR
        id: pr
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          RELEASE_KIND: ${{ steps.vars.outputs.release_kind }}
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          PR_JSON=$(retry --retries 3 --backoff 5 --max-backoff 30 -- gh pr list \
            --head "release/$VERSION" \
            --base main \
            --json number,isDraft,reviewDecision,statusCheckRollup \
            --limit 1)

          PR_COUNT=$(echo "$PR_JSON" | jq 'length')
          if [ "$PR_COUNT" != "1" ]; then
            echo "ERROR: Expected exactly 1 PR from release/$VERSION to main, found $PR_COUNT"
            exit 1
          fi

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number')
          IS_DRAFT=$(echo "$PR_JSON" | jq -r '.[0].isDraft')
          REVIEW_DECISION=$(echo "$PR_JSON" | jq -r '.[0].reviewDecision')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # The draft + approval gate applies only to the final release, which
          # burns the immutable X.Y.Z tag. Release candidates are disposable
          # verification artifacts (auto-incrementing rcN tags, never touch
          # :latest, no GitHub Release, pruned at promote), so they gate on CI
          # only and may run against a still-draft, not-yet-approved PR. The
          # approval that protects `main` is re-enforced by promote-release's
          # merge job regardless. See #902.
          if [ "$RELEASE_KIND" = "final" ]; then
            if [ "$IS_DRAFT" = "true" ]; then
              echo "ERROR: PR #$PR_NUMBER is still in draft"
              exit 1
            fi
            if [ "$REVIEW_DECISION" = "APPROVED" ]; then
              echo "PR #$PR_NUMBER is approved"
            elif [ "$REVIEW_DECISION" = "null" ] || [ -z "$REVIEW_DECISION" ]; then
              # Bot approval fallback when gh pr list leaves reviewDecision empty (#438)
              APPROVED_COUNT=$(retry --retries 3 --backoff 5 --max-backoff 30 -- gh api \
                --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
                | jq 'add | map(select(.state == "APPROVED")) | length')
              if [ "$APPROVED_COUNT" -eq 0 ]; then
                echo "ERROR: PR #$PR_NUMBER is not approved (reviewDecision: $REVIEW_DECISION, approved reviews: 0)"
                exit 1
              fi
              echo "reviewDecision='$REVIEW_DECISION' but $APPROVED_COUNT approved review(s) found"
            else
              echo "ERROR: PR #$PR_NUMBER is not approved (status: $REVIEW_DECISION)"
              exit 1
            fi
          else
            echo "Release kind '$RELEASE_KIND': deferring draft/approval gate to the final release (CI checks still enforced below)"
          fi

          STATUS_ROLLUP=$(echo "$PR_JSON" | jq -r '.[0].statusCheckRollup // []')
          CI_FAILED=$(echo "$STATUS_ROLLUP" | jq '[.[] | select(.conclusion == "FAILURE" or .conclusion == "ERROR")] | length')
          if [ "$CI_FAILED" != "0" ]; then
            echo "ERROR: PR #$PR_NUMBER has failed CI checks"
            exit 1
          fi

      - name: Summary
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          RELEASE_KIND: ${{ steps.vars.outputs.release_kind }}
          PUBLISH_VERSION: ${{ steps.publish_meta.outputs.publish_version }}
          NEXT_RC: ${{ steps.publish_meta.outputs.next_rc }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          RELEASE_DATE: ${{ steps.vars.outputs.release_date }}
          DRY_RUN: ${{ inputs.dry_run }}
          IMAGE_TAG: ${{ inputs.devkit_version }}
        run: |
          echo "Validation passed"
          echo ""
          echo "  Version:      $VERSION"
          echo "  Release Kind: $RELEASE_KIND"
          echo "  Publish Tag:  $PUBLISH_VERSION"
          if [ -n "$NEXT_RC" ]; then
            echo "  Next RC:      $NEXT_RC"
          fi
          echo "  Branch:       release/$VERSION"
          echo "  PR:           #$PR_NUMBER"
          echo "  Release Date: $RELEASE_DATE"
          echo "  Image Tag:    $IMAGE_TAG"
          echo "  Dry-run:      $DRY_RUN"

  finalize:
    name: Finalize Release Core
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
    container:
      image: ${{ inputs.toolchain_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    if: ${{ inputs.dry_run != true }}
    outputs:
      finalize_sha: ${{ steps.finalize.outputs.finalize_sha }}
      tag_already_exists: ${{ steps.tag_state.outputs.tag_already_exists }}

    steps:
      - name: Generate commit app token
        id: commit_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.COMMIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_APP_PRIVATE_KEY }}

      - name: Generate release app token
        id: release_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Resolve auth token
        id: auth
        env:
          PROVIDED_TOKEN: ${{ secrets.token }}
          FALLBACK_TOKEN: ${{ steps.release_app_token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -n "${PROVIDED_TOKEN:-}" ]; then
            echo "token=$PROVIDED_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "token=$FALLBACK_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: release/${{ needs.validate.outputs.version }}
          fetch-depth: 0
          token: ${{ steps.auth.outputs.token }}

      - name: Set up devkit toolchain
        uses: ./.github/actions/setup-devkit-toolchain
        with:
          mode: ${{ inputs.toolchain_mode }}
          devkit-version: ${{ inputs.devkit_version }}

      - name: Finalize CHANGELOG date
        if: ${{ inputs.release_kind == 'final' }}
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_DATE: ${{ needs.validate.outputs.release_date }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          # Prefix composes into the release heading + link only; an empty
          # prefix reproduces today's bare heading byte-for-byte (#1044).
          prepare-changelog finalize "$VERSION" "$RELEASE_DATE" CHANGELOG.md --tag-prefix "$TAG_PREFIX"

      # Language-neutral, opt-in release artifact. A repo that ships a committed
      # build artifact (e.g. a JS Action's @vercel/ncc `dist/`) exposes a
      # `bundle` just recipe; we detect it via `just --summary` so the step is a
      # no-op for repos without one (e.g. a pure-Python consumer). No new config
      # surface — the recipe's presence is the flag (#1029).
      - name: Detect release bundle recipe
        id: bundle
        if: ${{ inputs.release_kind == 'final' }}
        run: |
          set -euo pipefail
          if just --summary 2>/dev/null | grep -qw bundle; then
            echo "has_bundle=true" >> "$GITHUB_OUTPUT"
            echo "Bundle recipe detected; will build and commit dist/ in the finalization commit."
          else
            echo "has_bundle=false" >> "$GITHUB_OUTPUT"
            echo "No bundle recipe; skipping artifact build (language-neutral release)."
          fi

      - name: Build release artifact
        id: artifact
        if: ${{ inputs.release_kind == 'final' && steps.bundle.outputs.has_bundle == 'true' }}
        run: |
          set -euo pipefail
          # Install project deps (npm ci / uv sync) so the bundler (e.g. ncc, a
          # devDependency) is on PATH. The toolchain preamble provisions the
          # dev-shell but not the repo's node_modules, so `just bundle` alone
          # exits 127; every other build job syncs first (#1130).
          just sync
          # Rebuild the committed artifact from the finalized sources so the tag
          # ships a fresh bundle, not a stale one. Output (dist/) is committed
          # alongside CHANGELOG.md below.
          just bundle
          # Commit only the shipped bundle, not the whole dir. `just bundle`
          # also emits gitignored tsc/ncc byproducts (dist/src/**, *.tsbuildinfo);
          # commit-action walks a directory path on disk and force-adds EVERY
          # file it finds — it never consults .gitignore — so passing bare `dist`
          # re-tracks those byproducts on every final release (#1159).
          # `git ls-files -co --exclude-standard` lists tracked + untracked files
          # that are NOT gitignored (git-add semantics), so only the real bundle
          # (dist/index.js, dist/licenses.txt) reaches the finalize commit.
          DIST_PATHS=$(git ls-files -co --exclude-standard -- dist | paste -sd,)
          if [[ -z "$DIST_PATHS" ]]; then
            echo "::error::bundle recipe produced no non-ignored files under dist/" >&2
            exit 1
          fi
          echo "dist_paths=$DIST_PATHS" >> "$GITHUB_OUTPUT"

      - name: Commit and push finalization changes via API
        if: ${{ inputs.release_kind == 'final' }}
        uses: vig-os/commit-action@3a0588ec060d9647bf406e064cf9e6192a431864  # v0.3.1
        env:
          GH_TOKEN: ${{ steps.commit_app_token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: refs/heads/release/${{ needs.validate.outputs.version }}
          MAX_ATTEMPTS: "3"
          COMMIT_MESSAGE: |-
            chore: finalize release ${{ needs.validate.outputs.version }}

            Set release date to ${{ needs.validate.outputs.release_date }} in CHANGELOG.md

            Refs: #${{ needs.validate.outputs.pr_number }}
          # The fresh bundle joins the finalization commit only when one was
          # built (#1029), and only its non-ignored files — computed by the
          # build step — not the whole dir, so gitignored tsc/ncc emit stays
          # untracked (#1159).
          FILE_PATHS: ${{ steps.bundle.outputs.has_bundle == 'true' && format('CHANGELOG.md,{0}', steps.artifact.outputs.dist_paths) || 'CHANGELOG.md' }}

      - name: Trigger sync-issues workflow
        if: ${{ inputs.release_kind == 'final' }}
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          # Pin the dispatch to the release branch's ref. Without --ref, GitHub
          # resolves the workflow definition on the DEFAULT branch — the
          # pre-devkit sync-issues.yml until the first devkit release merges — so
          # the sync must run the release branch's own workflow, not whatever
          # trunk currently carries (#1150).
          retry --retries 2 --backoff 5 --max-backoff 20 -- \
            gh workflow run sync-issues.yml \
              --ref "release/$VERSION" \
              -f "target-branch=release/$VERSION"

      - name: Wait for sync-issues completion
        if: ${{ inputs.release_kind == 'final' }}
        id: wait_sync
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          # 120s was too tight even for the devkit workflow: the first
          # release-branch run has no cutoff cache and self-heals up to 14 days
          # of history, which can take minutes. Both polls filter --branch to the
          # dispatched release-branch run so a concurrent scheduled run is never
          # mistaken for it (#1150).
          TIMEOUT=600
          ELAPSED=0
          INTERVAL=10
          RUN_STATUS="unknown"
          sleep 5
          ELAPSED=5

          while [ $ELAPSED -lt $TIMEOUT ]; do
            RUN_STATUS=$(gh run list \
              --workflow sync-issues.yml \
              --branch "release/$VERSION" \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0].status' 2>/dev/null || echo "unknown")

            if [ "$RUN_STATUS" = "completed" ]; then
              break
            fi

            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ "$RUN_STATUS" != "completed" ]; then
            echo "ERROR: Timed out waiting for sync-issues workflow completion"
            exit 1
          fi

          RUN_CONCLUSION=$(gh run list \
            --workflow sync-issues.yml \
            --branch "release/$VERSION" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion' 2>/dev/null || echo "unknown")
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "ERROR: sync-issues workflow finished with conclusion '$RUN_CONCLUSION'"
            exit 1
          fi

      - name: Pull sync-issues changes
        if: ${{ inputs.release_kind == 'final' }}
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          retry --retries 3 --backoff 3 --max-backoff 20 -- git fetch origin "release/$VERSION"
          git reset --hard "origin/release/$VERSION"

      - name: Output finalize SHA
        id: finalize
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_KIND: ${{ inputs.release_kind }}
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_KIND" = "final" ]; then
            FINALIZE_SHA=$(git rev-parse HEAD)
          else
            FINALIZE_SHA=$(retry --retries 3 --backoff 5 --max-backoff 30 -- \
              gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/$VERSION" --jq '.object.sha')
          fi
          echo "finalize_sha=$FINALIZE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check if publish tag already exists at finalize SHA
        id: tag_state
        env:
          PUBLISH_VERSION: ${{ needs.validate.outputs.publish_version }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          FINALIZE_SHA: ${{ steps.finalize.outputs.finalize_sha }}
        run: |
          set -euo pipefail
          # Compose the actual tag name (prefix + bare publish version) (#1044).
          PUBLISH_TAG="${TAG_PREFIX}${PUBLISH_VERSION}"
          REMOTE_LINE=$(git ls-remote origin "refs/tags/${PUBLISH_TAG}^{}" || true)
          if [ -z "$REMOTE_LINE" ]; then
            REMOTE_LINE=$(git ls-remote origin "refs/tags/${PUBLISH_TAG}" || true)
          fi
          if [ -z "$REMOTE_LINE" ]; then
            echo "tag_already_exists=false" >> "$GITHUB_OUTPUT"
            echo "No remote tag ${PUBLISH_TAG} yet"
            exit 0
          fi
          REMOTE_TARGET_SHA=$(printf '%s\n' "$REMOTE_LINE" | awk '{print $1}')
          if [ -z "$REMOTE_TARGET_SHA" ]; then
            echo "tag_already_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REMOTE_TARGET_SHA" != "$FINALIZE_SHA" ]; then
            echo "ERROR: Tag $PUBLISH_TAG exists but target commit is $REMOTE_TARGET_SHA; expected $FINALIZE_SHA (finalize SHA)"
            exit 1
          fi
          echo "tag_already_exists=true" >> "$GITHUB_OUTPUT"
          echo "Remote tag $PUBLISH_TAG already points to finalize SHA; publish will skip tag create/push"

  test:
    name: Test Finalized Release
    needs: [validate, finalize]
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.toolchain_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    if: ${{ inputs.dry_run != true }}

    steps:
      - name: Generate release app token
        id: release_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Resolve auth token
        id: auth
        env:
          PROVIDED_TOKEN: ${{ secrets.token }}
          FALLBACK_TOKEN: ${{ steps.release_app_token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -n "${PROVIDED_TOKEN:-}" ]; then
            echo "token=$PROVIDED_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "token=$FALLBACK_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout finalized commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.finalize.outputs.finalize_sha }}
          token: ${{ steps.auth.outputs.token }}

      - name: Set up devkit toolchain
        uses: ./.github/actions/setup-devkit-toolchain
        with:
          mode: ${{ inputs.toolchain_mode }}
          devkit-version: ${{ inputs.devkit_version }}

      - name: Sync dependencies
        run: just sync

      - name: Run tests
        run: just test
