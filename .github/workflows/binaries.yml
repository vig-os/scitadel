# Builds prebuilt scitadel binaries when a semver tag is pushed and attaches
# platform tarballs + SHA256 sums to the GitHub Release.
#
# Immutable releases forbid asset uploads after publish, so the flow is:
# release-please creates the release as a DRAFT (draft + force-tag-creation);
# the build matrix uploads tarballs to that draft (still mutable); then the
# `publish` job flips draft -> published once, making it immutable WITH assets.
#
# Triggered on tags matching X.Y.Z (and pre-releases like X.Y.Z-rcN), or
# manually via workflow_dispatch for an existing tag whose release is a draft.

name: Binaries

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload assets for (e.g. 0.7.0)"
        required: true

# Needed to upload assets to the GitHub Release. Without this the default
# GITHUB_TOKEN is read-only under restrictive org defaults and the upload
# fails with "Resource not accessible by integration".
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: scitadel

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p scitadel-cli

      - name: Package tarball
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag || github.ref_name }}"
          DIST_NAME="${BINARY_NAME}-${VERSION}-${{ matrix.target }}"
          STAGE=$(mktemp -d)
          mkdir -p "${STAGE}/${DIST_NAME}"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "${STAGE}/${DIST_NAME}/"
          cp README.md LICENSE-APACHE LICENSE-MIT CHANGELOG.md "${STAGE}/${DIST_NAME}/"
          TAR="${DIST_NAME}.tar.gz"
          (cd "$STAGE" && tar czf "$TAR" "$DIST_NAME")
          mv "${STAGE}/${TAR}" .
          shasum -a 256 "$TAR" > "${TAR}.sha256"
          echo "tarball=$TAR" >> "$GITHUB_OUTPUT"
          echo "checksum=${TAR}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true   # keep it a draft; parallel matrix jobs must not publish
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.checksum }}
          fail_on_unmatched_files: true

  # Flip the draft to published exactly once, after all platform tarballs are
  # attached. Publishing makes the release immutable with its assets in place.
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" --draft=false
