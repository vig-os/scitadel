# Managed by vigOS devkit — regenerated on upgrade; local edits are lost.
# Customize in justfile.project. Bugs / missing tools: https://github.com/vig-os/devkit/issues

# Self-polling devkit upgrade (#1296). Weekly (and on explicit dispatch) this
# checks for a newer devkit release and, when found, runs the full-fidelity
# `install.sh --force` upgrade — the .vig-os pin, the flake.lock `vigos` node and
# the full scaffold regeneration move together, with the commit made inside the
# project shell so consumer hooks run — then opens the adoption PR. Renovate-style
# pull: no devkit-side action at release time, no consumer registry, and no
# adoption issue (vig-os/devkit#1405) — like a Renovate PR, the bot PR is the
# traceable artifact and the changelog entry (vig-os/devkit#1404) links it.
#
# A FAILED run does leave an artifact (vig-os/devkit#1530): the `report` job
# files one tracking issue per repo, comments on it on every repeat failure and
# closes it on the next green run. Without it a failure is visible only as a red
# scheduled run and the pin silently stops moving.
#
# Requires a dedicated GitHub App identity: DEVKIT_UPGRADE_APP_CLIENT_ID +
# DEVKIT_UPGRADE_APP_PRIVATE_KEY (repo or org secrets) feed a per-run
# installation token minted in-workflow — contents:write + pull-requests:write +
# workflows:write on this repo, plus issues:write for the failure report (the
# only optional grant: the report degrades to a warning without it, the upgrade
# itself is unaffected). The legacy numeric
# DEVKIT_UPGRADE_APP_ID still works this release (either value is a valid App
# JWT issuer); vig-os/devkit#1366 retires it. The default GITHUB_TOKEN cannot
# open the PR: PRs it creates do not trigger CI. A static PAT is not supported
# (#1302: user-bound, expiring, single-owner). The workflow fails fast when the
# secrets are absent. App provisioning + rotation:
# https://github.com/vig-os/devkit/issues/1302

name: Devkit Upgrade

on:  # yamllint disable-line rule:truthy
  # Weekly, Monday early AM — aligned with the Renovate window (before 9am Mon).
  # Scheduled runs execute from the default branch; the job checks out and
  # targets the right base itself.
  schedule:
    - cron: '0 6 * * 1'
  # Explicit version (final or rc) — the release-train / lane-re-bump path.
  workflow_dispatch:
    inputs:
      version:
        description: 'Devkit version to adopt (final or rc, e.g. 1.5.0 or 1.5.0-rc1)'
        required: true
        type: string

permissions: {}  # restrict default; the job declares its own

concurrency:
  group: devkit-upgrade-${{ github.repository }}
  cancel-in-progress: false

jobs:
  upgrade:
    name: Adopt newer devkit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The branch and PR are created with the minted App token (a dedicated
      # identity, so the PR triggers CI); the default token stays read-only
      # for the public releases/latest query.
      contents: read
    outputs:
      # Consumed by the `report` job (#1530) so a failure alert can name the
      # versions. Both are empty when the resolve step never got that far.
      current: ${{ steps.resolve.outputs.current }}
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - name: Require the upgrade App identity
        env:
          APP_CLIENT_ID: ${{ secrets.DEVKIT_UPGRADE_APP_CLIENT_ID }}
          APP_ID_LEGACY: ${{ secrets.DEVKIT_UPGRADE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.DEVKIT_UPGRADE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if { [ -z "${APP_CLIENT_ID}" ] && [ -z "${APP_ID_LEGACY}" ]; } || [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "::error::DEVKIT_UPGRADE_APP_CLIENT_ID / DEVKIT_UPGRADE_APP_PRIVATE_KEY secrets are not configured. This workflow needs a dedicated GitHub App identity (contents:write + pull-requests:write + workflows:write, plus optional issues:write for the failure report): the default GITHUB_TOKEN cannot open a PR that triggers CI, and a static PAT is not supported. See https://github.com/vig-os/devkit/issues/1302."
            exit 1
          fi
          if [ -z "${APP_CLIENT_ID}" ]; then
            echo "::warning::DEVKIT_UPGRADE_APP_ID is deprecated; create a DEVKIT_UPGRADE_APP_CLIENT_ID secret with the App's Client ID. The numeric fallback is removed in a future release. See https://github.com/vig-os/devkit/issues/1366."
          fi

      - name: Mint the upgrade App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          # Either secret works as the App JWT issuer; the legacy numeric
          # fallback is retired by vig-os/devkit#1366.
          client-id: ${{ secrets.DEVKIT_UPGRADE_APP_CLIENT_ID || secrets.DEVKIT_UPGRADE_APP_ID }}
          private-key: ${{ secrets.DEVKIT_UPGRADE_APP_PRIVATE_KEY }}
          # Least-privilege mint (zizmor github-app): the token carries exactly
          # the three permissions this workflow exercises, independent of any
          # broader grants on the App installation.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Base branch per workflow model: gitflow -> dev, trunk -> main
          # (retargeted to `main` at scaffold time for a trunk repo).
          ref: dev
          # Persist the minted token so the later push authenticates as the
          # upgrade identity (whose PR triggers CI).
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Resolve target version
        id: resolve
        env:
          # Route untrusted values through env (never inline ${{ }} in run:) —
          # a dispatch input expanded as code is a template-injection sink.
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          # Read-only public query — the default token is sufficient.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Prerelease-aware semver compare: returns 0 (true) when $1 >= $2,
          # treating a prerelease (X.Y.Z-rc1) as LOWER than its release (X.Y.Z).
          # Load-bearing for the "current or ahead" no-op: a consumer on an rc of
          # a newer train must never be downgraded to the older final.
          version_ge() {
            local a="$1" b="$2"
            local acore="${a%%-*}" bcore="${b%%-*}"
            local apre="" bpre=""
            [ "$a" != "$acore" ] && apre="${a#*-}"
            [ "$b" != "$bcore" ] && bpre="${b#*-}"
            local i ai bi
            local -a av bv
            IFS='.' read -ra av <<< "$acore"
            IFS='.' read -ra bv <<< "$bcore"
            for i in 0 1 2; do
              ai="${av[$i]:-0}"; bi="${bv[$i]:-0}"
              if [ "$ai" -gt "$bi" ]; then return 0; fi
              if [ "$ai" -lt "$bi" ]; then return 1; fi
            done
            # Equal cores: release > prerelease; prerelease compared lexically.
            if [ -z "$apre" ] && [ -z "$bpre" ]; then return 0; fi
            if [ -z "$apre" ]; then return 0; fi
            if [ -z "$bpre" ]; then return 1; fi
            [ "$apre" = "$bpre" ] && return 0
            [ "$(printf '%s\n%s\n' "$apre" "$bpre" | LC_ALL=C sort | head -n1)" = "$bpre" ]
          }

          CURRENT="$(sed -n 's/^DEVKIT_VERSION=//p' .vig-os | head -n1)"
          if [ -z "$CURRENT" ]; then
            echo "::error::.vig-os has no DEVKIT_VERSION pin."
            exit 1
          fi
          # Published before anything below can fail, so a failure report always
          # names the pin the repo is stuck on (#1530).
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "schedule" ]; then
            # Opt-out knob: gates the schedule path only. Empty (default) or any
            # value other than the literal `false` keeps auto-upgrade enabled.
            AUTO="$(sed -n 's/^DEVKIT_AUTO_UPGRADE=//p' .vig-os | head -n1)"
            if [ "$AUTO" = "false" ]; then
              echo "DEVKIT_AUTO_UPGRADE=false — scheduled upgrade disabled; no-op."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # releases/latest excludes prereleases and drafts by construction, so
            # cron never proposes an rc.
            TARGET="$(gh api repos/vig-os/devkit/releases/latest --jq .tag_name | sed 's/^v//')"
          else
            TARGET="${DISPATCH_VERSION#v}"
          fi

          # Validate the resolved version (defence-in-depth: TARGET flows into
          # later shell / gh / git commands). A strict semver shape also rejects
          # any hostile dispatch input before it can reach those sinks.
          if ! printf '%s' "$TARGET" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Refusing to act on malformed target version: '${TARGET}'."
            exit 1
          fi

          if [ "$EVENT_NAME" = "schedule" ] && version_ge "$CURRENT" "$TARGET"; then
            echo "Current pin ${CURRENT} is at or ahead of latest ${TARGET}; no-op."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The adoption branch keys on the TRAIN (prerelease stripped) so
          # rc1 -> rc2 -> final within a train reuse the same branch/PR; the
          # commit + PR title carry the exact installed version.
          TRAIN="${TARGET%%-*}"
          {
            echo "proceed=true"
            echo "target=${TARGET}"
            echo "train=${TRAIN}"
            echo "branch-suffix=$(echo "${TRAIN}" | tr '.' '-')"
          } >> "$GITHUB_OUTPUT"

      - name: Create the upgrade branch
        id: branch
        if: steps.resolve.outputs.proceed == 'true'
        env:
          SUFFIX: ${{ steps.resolve.outputs.branch-suffix }}
        run: |
          set -euo pipefail
          # Dots -> dashes: the consumer branch guard rejects dots and any
          # prefix outside its allowlist (the issue-less chore/<summary> shape
          # is explicitly allowed — no adoption issue exists, #1405).
          BRANCH="chore/devkit-${SUFFIX}"
          git switch -c "$BRANCH" 2>/dev/null || git switch "$BRANCH"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"

      # Same Nix settings as setup-devkit-toolchain's installer step (kept in
      # lockstep by test): accept-flake-config lets THIS repo's own flake.nix
      # contribute the substituters it declares, and the vig-os Cachix pull
      # (no token) warms the dev-shell the commit step below realizes. Without
      # them both Nix legs of this job — install.sh's `nix flake update` and
      # the `nix develop` commit — warn "ignoring untrusted flake configuration
      # setting" and fall back to cache.nixos.org alone (#1599).
      #
      # This is not the #773 trapdoor: that was `accept-flake-config` baked
      # into the IMAGE's nix.conf, where any container-run foreign flake could
      # redirect the substituters. Here it is per-runner, in a job that
      # evaluates this repo's flake and nothing else.
      - name: Install Nix
        if: steps.resolve.outputs.proceed == 'true'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://vig-os.cachix.org
            extra-trusted-public-keys = vig-os.cachix.org-1:yoOYRi3bvnM6ThxO0joLt7vtzhTfkq3r6jykeUMg7Bk=

      - name: Run the devkit upgrade (install.sh --force)
        id: upgrade
        if: steps.resolve.outputs.proceed == 'true'
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
        run: |
          set -euo pipefail
          # docker is present on ubuntu-latest (install.sh auto-detects it); nix
          # (installed above) advances the floating devkit flake.lock node. The
          # workflow owns the branch, so bypass install.sh's own preflight guard.
          # --docker pins the runner's first-class runtime explicitly: the
          # preinstalled podman can pair with a stale system crun that rejects
          # podman >= 5's OCI configs (#1305) — auto-detection now prefers a
          # responsive docker anyway, this makes the choice self-documenting.
          #
          # The installer comes from the TARGET's own tag, not main (#1532):
          # installer and scaffold payload must move together — a main-tip
          # installer paired with a released payload is an untested combination,
          # and it is what every scheduled run got while main was ahead of the
          # latest release. It also removes the window where any push to devkit
          # main changes code executing here with contents: write. No main
          # fallback: the resolve step above admits only X.Y.Z[-pre] versions,
          # and every devkit tag of that shape carries a root-level install.sh.
          curl -sSfL "https://raw.githubusercontent.com/vig-os/devkit/refs/tags/${TARGET}/install.sh" \
            | bash -s -- --force --version "$TARGET" --skip-preflight --docker . \
            | tee "$RUNNER_TEMP/install.log"
          # Surface the flake-input advance outcome (#1497): install.sh prints
          # exactly one plain `flake-bump:` line per run — advanced, or skipped
          # with the reason (pinned ref, no recognized input, no nix). A silent
          # decline was the whole bug; the line rides into the step summary here
          # and the adoption PR body below, so the consumer can decide.
          FLAKE_BUMP="$(grep -E '^flake-bump:' "$RUNNER_TEMP/install.log" | tail -n1 || true)"
          echo "flake-bump=${FLAKE_BUMP}" >> "$GITHUB_OUTPUT"
          if [ -n "$FLAKE_BUMP" ]; then
            echo "- ${FLAKE_BUMP}" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Known-bad blocks in a PRESERVED config (#1652): the scaffold cannot
          # rewrite a consumer-owned file (#878), so a hook fix never reaches
          # the repos that carry the broken block — it prints one
          # `preserved-hook-drift:` line per known-bad block instead. Ride that
          # same channel as flake-bump: a warning left in the workflow log reaches
          # nobody, and the PR is where this repo's owner already looks. Multi-line
          # (one line per known-bad block), hence the delimited output form.
          HOOK_DRIFT="$(grep -E '^preserved-hook-drift:' "$RUNNER_TEMP/install.log" || true)"
          {
            echo "hook-drift<<DEVKIT_EOF"
            if [ -n "$HOOK_DRIFT" ]; then printf '%s\n' "$HOOK_DRIFT"; fi
            echo "DEVKIT_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$HOOK_DRIFT" ]; then
            printf '%s\n' "$HOOK_DRIFT" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          fi
          # Reconciled blocks (#1654): the opposite statement to the drift
          # channel above — the upgrade REWROTE the consumer-owned config (folded
          # a retired block, inserted a hook the tree never received), so the
          # hunk is in this PR and wants a reviewer's eye. Its own output, not
          # HOOK_DRIFT's, because the two ask for different actions.
          HOOK_RECONCILE="$(grep -E '^preserved-hook-(fold|insert):' "$RUNNER_TEMP/install.log" || true)"
          {
            echo "hook-reconcile<<DEVKIT_EOF"
            if [ -n "$HOOK_RECONCILE" ]; then printf '%s\n' "$HOOK_RECONCILE"; fi
            echo "DEVKIT_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$HOOK_RECONCILE" ]; then
            printf '%s\n' "$HOOK_RECONCILE" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reset excluded paths
        if: steps.resolve.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          # DEVKIT_UPGRADE_EXCLUDE: comma-separated paths (whitespace-tolerant)
          # reset to the base branch before the commit — e.g. generated-doc churn
          # that must not ride along in the adoption diff.
          EXCLUDE="$(sed -n 's/^DEVKIT_UPGRADE_EXCLUDE=//p' .vig-os | head -n1)"
          IFS=',' read -ra PATHS <<< "$EXCLUDE"
          for path in ${PATHS[@]+"${PATHS[@]}"}; do
            path="$(echo "$path" | xargs)"
            [ -z "$path" ] && continue
            echo "Resetting excluded path: ${path}"
            git checkout -- "$path" 2>/dev/null || true
          done

      - name: Commit the upgrade in the project shell
        id: commit
        if: steps.resolve.outputs.proceed == 'true'
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          # Commit identity (configurable via repo variables). Must not match
          # .github/agent-blocklist.toml — the default avoids github-actions[bot]
          # and any AI-agent fingerprint.
          GIT_AUTHOR_NAME: ${{ vars.DEVKIT_UPGRADE_AUTHOR_NAME || 'vigos-devkit-bot' }}
          GIT_AUTHOR_EMAIL: ${{ vars.DEVKIT_UPGRADE_AUTHOR_EMAIL || 'devkit-bot@users.noreply.github.com' }}
          GIT_COMMITTER_NAME: ${{ vars.DEVKIT_UPGRADE_AUTHOR_NAME || 'vigos-devkit-bot' }}
          GIT_COMMITTER_EMAIL: ${{ vars.DEVKIT_UPGRADE_AUTHOR_EMAIL || 'devkit-bot@users.noreply.github.com' }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes after upgrade; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Commit INSIDE the project shell so consumer hooks run (dist rebuild in
          # commit-action, trailer strip, validate-commit-msg). chore is
          # Refs-exempt and no adoption issue exists (#1405) — the PR is the
          # traceable artifact. This LOCAL commit is a staging artifact only —
          # the next step replays its tree through the API as a GitHub-signed
          # commit; the unsigned one never leaves the runner (#1308).
          printf 'chore: adopt devkit %s\n' "$TARGET" > "${RUNNER_TEMP}/commit-msg"
          nix develop -c git commit -F "${RUNNER_TEMP}/commit-msg"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the adoption commit via API (verified)
        if: steps.resolve.outputs.proceed == 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          # The in-shell commit above is a STAGING artifact — hooks ran and the
          # message validated, but a worktree commit is unsigned and consumers'
          # Signed-commits rulesets rightfully reject it. Replay its tree
          # through the git-data API with the App token instead: API-created
          # commits are signed by GitHub as the App, so the published commit is
          # verified and no ruleset needs a bypass (#1308). The tree API also
          # carries an explicit mode per entry, so executable bits survive —
          # createCommitOnBranch would silently drop them.
          REPO="${GITHUB_REPOSITORY}"
          MESSAGE="$(git log -1 --format=%B)"
          BASE_SHA="$(git rev-parse HEAD^)"
          BASE_TREE="$(gh api "repos/${REPO}/git/commits/${BASE_SHA}" --jq .tree.sha)"

          # One tree entry per path the staging commit touched. --no-renames
          # keeps the status alphabet to A/M/D (a rename becomes A + D).
          entries='[]'
          while IFS=$'\t' read -r status path; do
            [ -n "$path" ] || continue
            if [ "$status" = "D" ]; then
              # Deletion: a null-sha entry removes the path from the tree.
              entries="$(jq --arg p "$path" \
                '. + [{path: $p, mode: "100644", type: "blob", sha: null}]' \
                <<<"$entries")"
            else
              mode=100644
              [ -x "$path" ] && mode=100755
              blob="$(gh api -X POST "repos/${REPO}/git/blobs" \
                -f content="$(base64 -w0 "$path")" -f encoding=base64 --jq .sha)"
              entries="$(jq --arg p "$path" --arg m "$mode" --arg s "$blob" \
                '. + [{path: $p, mode: $m, type: "blob", sha: $s}]' \
                <<<"$entries")"
            fi
          done < <(git diff --name-status --no-renames "${BASE_SHA}" HEAD)

          COUNT="$(jq length <<<"$entries")"
          if [ "$COUNT" -eq 0 ]; then
            echo "Empty delta after staging; nothing to publish."
            exit 0
          fi
          echo "Publishing ${COUNT} tree entries..."

          TREE="$(jq -n --argjson t "$entries" --arg b "$BASE_TREE" \
            '{base_tree: $b, tree: $t}' \
            | gh api -X POST "repos/${REPO}/git/trees" --input - --jq .sha)"
          COMMIT="$(jq -n --arg m "$MESSAGE" --arg t "$TREE" --arg p "$BASE_SHA" \
            '{message: $m, tree: $t, parents: [$p]}' \
            | gh api -X POST "repos/${REPO}/git/commits" --input - --jq .sha)"

          # Create the branch ref on first use; force-update within a train so
          # rc -> rc -> final reuse refreshes the same branch/PR to the latest
          # bump (the semantics the old force-push provided).
          if gh api "repos/${REPO}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/heads/${BRANCH}" \
              -f sha="$COMMIT" -F force=true >/dev/null
          else
            gh api -X POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="$COMMIT" >/dev/null
          fi
          echo "Published verified commit ${COMMIT} to ${BRANCH}."

      - name: Open or update the adoption PR
        if: steps.resolve.outputs.proceed == 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ steps.resolve.outputs.target }}
          BRANCH: ${{ steps.branch.outputs.name }}
          FLAKE_BUMP: ${{ steps.upgrade.outputs.flake-bump }}
          HOOK_DRIFT: ${{ steps.upgrade.outputs.hook-drift }}
          HOOK_RECONCILE: ${{ steps.upgrade.outputs.hook-reconcile }}
          # PR base per workflow model (retargeted dev -> main at scaffold time).
          BASE: dev
        run: |
          set -euo pipefail
          # No adoption issue and no auto-close marker (#1405): a no-diff run
          # now simply skips publish + PR with nothing to garbage-collect (the
          # stranded-issue cleanup this replaced was #1347).
          TITLE="chore: adopt devkit ${TARGET}"
          BODY="$(printf 'Automated devkit upgrade to %s via install.sh --force.\n\nReview the scaffold + flake.lock diff and merge. Release notes: https://github.com/vig-os/devkit/releases/tag/%s\n' "$TARGET" "$TARGET")"
          # The flake-input outcome (#1497): a skipped advance is a decision
          # the consumer makes, not a silent no-op — put it where they review.
          if [ -n "$FLAKE_BUMP" ]; then
            BODY="$(printf '%s\n%s\n' "$BODY" "$FLAKE_BUMP")"
          fi
          # Preserved-config drift (#1652): the upgrade could not deliver these
          # hook fixes — only the consumer can fold them in, so say so where
          # they review the adoption.
          # shellcheck disable=SC2016  # backticks are literal Markdown code spans, not command substitution
          if [ -n "$HOOK_DRIFT" ]; then
            BODY="$(printf '%s\n**Preserved config keeps a retired hook block** — the upgrade cannot rewrite a consumer-owned file; fold these in by hand (see MIGRATION.md):\n\n```\n%s\n```\n' "$BODY" "$HOOK_DRIFT")"
          fi
          # Reconciled blocks (#1654): this upgrade DID rewrite the preserved
          # hook config. Say so where the diff is reviewed, next to the hunk.
          # shellcheck disable=SC2016  # backticks are literal Markdown code spans, not command substitution
          if [ -n "$HOOK_RECONCILE" ]; then
            BODY="$(printf '%s\n**Preserved hook config reconciled** — the upgrade rewrote `.pre-commit-config.yaml`; review the hunk (see MIGRATION.md):\n\n```\n%s\n```\n' "$BODY" "$HOOK_RECONCILE")"
          fi
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY"
            echo "Updated the existing adoption PR."
          else
            gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body "$BODY"
            echo "Opened the adoption PR."
          fi

  # Failure reporting (#1530). A failed upgrade leaves nothing in the repo: the
  # adoption branch only reaches the remote in the publish step above, so an
  # earlier failure (version resolve, scaffold run, in-shell commit) shows up
  # only as a red scheduled run — and the pin then sits still, week after week.
  # This is NOT the adoption issue #1405 removed: that one tracked the SUCCESS
  # path, where the bot PR is already the artifact. Here there is no artifact by
  # construction, so one tracking issue per repo carries the failure and closes
  # itself when the upgrade works again.
  #
  # A separate job rather than a late `if: failure()` step: a step never runs
  # once the job itself is aborted (the 30-minute timeout, a lost runner), which
  # is exactly one of the silent failures this closes. Keying both legs on
  # `needs.upgrade.result` also reports nothing for a cancelled run.
  report:
    name: Report upgrade outcome
    needs: upgrade
    # The !cancelled() is load-bearing: a job-level `if` without a status-check
    # function gets an implicit success() gate, which would skip this job on
    # exactly the failed runs it exists to report.
    if: ${{ !cancelled() && (needs.upgrade.result == 'failure' || needs.upgrade.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Reads this run's own step conclusions to name the failing step; the
      # tracking issue itself is written with the App token minted below.
      actions: read
    steps:
      - name: Mint an issues-scoped App token
        id: issues-token
        # Best-effort, and load-bearing that it is: create-github-app-token
        # FAILS the mint when it requests a permission the installation lacks,
        # and this App has needed no Issues grant since #1405. Requesting it on
        # the upgrade job's token would therefore turn every green upgrade red
        # on an org that has not re-granted it — reporting may never break the
        # path it reports on. Both legs below degrade to a warning instead.
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.DEVKIT_UPGRADE_APP_CLIENT_ID || secrets.DEVKIT_UPGRADE_APP_ID }}
          private-key: ${{ secrets.DEVKIT_UPGRADE_APP_PRIVATE_KEY }}
          # Least-privilege mint (zizmor github-app): the report writes issues
          # and nothing else — no contents, no PRs, no workflows.
          permission-issues: write

      - name: File or update the upgrade-failure issue
        if: needs.upgrade.result == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.issues-token.outputs.token }}
          # No checkout in this job, so gh resolves the repo from the env.
          GH_REPO: ${{ github.repository }}
          # The default token reads this run's job records (actions: read).
          RUN_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CURRENT: ${{ needs.upgrade.outputs.current }}
          TARGET: ${{ needs.upgrade.outputs.target }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::This failure was not filed as a tracking issue: the devkit-upgrade App installation is missing the Issues (write) grant. Grant it and the next failure reports itself. See https://github.com/vig-os/devkit/issues/1530."
            exit 0
          fi
          # The lookup keys on a body marker, not on the title: the title stays
          # version-free so a failure on a NEW target still finds the one open
          # issue (and no title goes stale), and a marker cannot collide with a
          # human's issue the way a title prefix can. The plain issue listing is
          # deliberate over `--search`: it enumerates the repo's open issues
          # directly instead of the eventually-consistent search index, so an
          # issue filed minutes ago is already visible. Bound: the 100 most
          # recent open issues.
          MARKER='<!-- devkit-upgrade-failure -->'
          TITLE='chore(devkit): automated devkit upgrade is failing'
          # Name the failing step from this run's own job records — no per-step
          # instrumentation to keep in sync with the steps above.
          FAILED="$(GH_TOKEN="$RUN_TOKEN" gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '[.jobs[].steps[]? | select(.conclusion == "failure") | .name] | join(", ")' \
            2>/dev/null || true)"
          [ -n "$FAILED" ] || FAILED='unknown, see the run log'
          DETAILS="$(printf -- '- Run: %s\n- Failing step: %s\n- Pinned devkit version: %s\n- Target devkit version: %s\n' \
            "$RUN_URL" "$FAILED" "${CURRENT:-unknown}" "${TARGET:-unknown (the version resolve did not complete)}")"
          NUM="$(gh issue list --state open --limit 100 --json number,body \
            | jq -r --arg m "$MARKER" \
              'map(select((.body // "") | contains($m))) | first | .number // empty')"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$(printf 'The devkit upgrade failed again.\n\n%s' "$DETAILS")"
            echo "Updated tracking issue #${NUM}."
          else
            gh issue create --title "$TITLE" --body "$(printf '%s\n\nThe managed devkit-upgrade workflow is failing, so this repo has stopped adopting new devkit releases.\n\n%s\nNothing was pushed: the adoption branch only reaches the remote once the upgrade commit is published, so there is no half-applied state to clean up. Fix the cause and re-run the workflow (or dispatch it with an explicit version) — this issue is filed, updated and closed by the workflow itself.\n' "$MARKER" "$DETAILS")"
            echo "Filed a tracking issue."
          fi

      - name: Close the upgrade-failure issue
        if: needs.upgrade.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.issues-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # ANY fully green run self-cleans the alert, including the no-op
          # "already current" and DEVKIT_AUTO_UPGRADE=false paths: the workflow
          # ran end to end, so whatever was recorded no longer reproduces — and
          # a consumer that opted out should not keep an open alert either.
          if [ -z "${GH_TOKEN}" ]; then
            echo "No issues-scoped token; nothing to close."
            exit 0
          fi
          MARKER='<!-- devkit-upgrade-failure -->'
          NUM="$(gh issue list --state open --limit 100 --json number,body \
            | jq -r --arg m "$MARKER" \
              'map(select((.body // "") | contains($m))) | first | .number // empty')"
          if [ -z "$NUM" ]; then
            echo "No open devkit-upgrade tracking issue; nothing to close."
            exit 0
          fi
          gh issue close "$NUM" \
            --comment "$(printf 'The devkit upgrade ran green again: %s\n' "$RUN_URL")"
          echo "Closed tracking issue #${NUM}."
