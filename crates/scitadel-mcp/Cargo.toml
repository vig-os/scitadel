[package]
name = "scitadel-mcp"
version = "0.8.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "MCP server exposing scitadel tools to host LLMs."
readme = "../../README.md"

[dependencies]
scitadel-core = { path = "../scitadel-core", version = "0.8.0" } # x-release-please-version
scitadel-db = { path = "../scitadel-db", version = "0.8.0" } # x-release-please-version
scitadel-adapters = { path = "../scitadel-adapters", version = "0.8.0" } # x-release-please-version
scitadel-scoring = { path = "../scitadel-scoring", version = "0.8.0" } # x-release-please-version
scitadel-export = { path = "../scitadel-export", version = "0.8.0" } # x-release-please-version
rmcp = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
pdf-extract = { workspace = true }
scraper = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = { workspace = true }
# Only for `acquire`'s test seam. An MCP `acquire` that reached the network
# would be untestable, and the test has to *count requests* to prove which
# works were asked for — so it builds its own `PacedClient` and points the
# ladder at a wiremock server. Neither crate is a runtime dependency: the tool
# itself goes through `scitadel-adapters`' public `PaperDownloader`.
scitadel-http = { path = "../scitadel-http", version = "0.8.0" } # x-release-please-version
wiremock = { workspace = true }

[lints]
workspace = true
