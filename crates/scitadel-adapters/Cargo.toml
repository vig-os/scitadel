[package]
name = "scitadel-adapters"
version = "0.8.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Source adapters (PubMed, arXiv, OpenAlex, INSPIRE, EPO, PatentsView, Lens) and the paper download chain for scitadel."
readme = "../../README.md"

[features]
# DES-002 deliverable E4, revived in #268: live requests that assert the
# response still *parses*, never that a field value is right. Gated rather
# than `#[ignore]`d because a feature that gates nothing is what let E4 rot
# silently for the life of the project — `oa_live::tests::
# the_contract_gate_covers_a_real_live_test` asserts the gate is wired, so
# emptying the gated file fails the default suite.
contract-tests = []

[dependencies]
scitadel-core = { path = "../scitadel-core", version = "0.8.0" } # x-release-please-version
scitadel-db = { path = "../scitadel-db", version = "0.8.0" } # x-release-please-version # ADR-007 §1: artefact + blob writes for the flat-layout importer and the download chain's dual-write
scitadel-http = { path = "../scitadel-http", version = "0.8.0" } # x-release-please-version # ADR-007 §3: PacedClient is the only way a request leaves the process
chrono = { workspace = true }
reqwest = { workspace = true }
quick-xml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
strsim = { workspace = true } # ADR-007 §3: the identity matcher's title similarity and its surname comparison
thiserror = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true } # ADR-007 §3: diacritic-insensitive title matching. Already in Cargo.lock at 0.1.25 (transitively, via idna), so this adds a dependency edge and no new package

# `O_NOFOLLOW` / `O_NONBLOCK` constants for the verified-open gate
# `find_cached_file` runs over a DB-supplied `blob_rel_path` (#266
# round 6): the constants are platform-specific, so we route them
# through `libc` rather than hard-code them per target. Unix-only;
# Windows builds don't pull libc for this crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The importer's tests assert on `artefacts` rows directly; the library
# code itself never names rusqlite (that stays behind scitadel-db).
rusqlite = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
insta = { workspace = true }

[lints]
workspace = true
