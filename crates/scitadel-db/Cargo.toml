[package]
name = "scitadel-db"
version = "0.8.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SQLite-backed repositories and migrations for scitadel."
readme = "../../README.md"

[dependencies]
scitadel-core = { path = "../scitadel-core", version = "0.8.0" } # x-release-please-version
async-trait = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
serde = { workspace = true } # ADR-007 §2: coverage / action_list JSON is the report, serialized
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
strsim = { workspace = true }
sha2 = { workspace = true } # ADR-007 §1: hashing legacy files into content-addressed blobs

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }

[lints]
workspace = true
