[package]
name = "scitadel-http"
# Per-crate versions are explicit and kept in lockstep by
# `cargo set-version --workspace`; the workspace has no shared
# `package.version` for them to drift against (see the root Cargo.toml).
version = "0.8.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Paced HTTP acquisition for scitadel: one pacing permit per redirect hop, publisher-platform buckets, and login-redirect detection (ADR-007 S1)."
readme = "../../README.md"

[dependencies]
scitadel-core = { path = "../scitadel-core", version = "0.8.0" }
async-trait = { workspace = true }
reqwest = { workspace = true }
url = "2"
tokio = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
wiremock = { workspace = true }

[lints]
workspace = true