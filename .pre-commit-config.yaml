---
# .pre-commit-config.yaml

exclude: ^.github_data/|^docs/issues/|^docs/pull-requests/

repos:
  # General Pre-commit Hooks (Fixes formatting issues)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      # Enforce topic branch naming:
      # - chore/<short_summary> (no issue required)
      # - <type>/<issue_number>-<short_summary> (for feature, bugfix, etc.)
      # - worktree/<issue_number> (autonomous worktree branches)
      # Allows main, dev, and branches matching the convention.
      - id: no-commit-to-branch
        name: branch-name (enforce <type>/<issue>-<summary>)
        args:
          - --branch
          - __none__  # override default so main/dev are not protected
          - --pattern
          - "^(?!main$)(?!dev$)(?!^(chore)/[a-z0-9]+(-[a-z0-9]+)*$)(?!^(feature|bugfix|hotfix|release|docs|test|refactor)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$)(?!^worktree/[0-9]+$).+$"
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
        # The JSONC scaffold files carry a `//` provenance banner (#1053) that
        # check-json's strict parser rejects; VS Code accepts it. Strict-JSON
        # files (renovate.json etc.) stay checked.
        exclude: (^|/)\.vscode/settings\.json$
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        # git-hooks.nix' check-yaml built-in hardcodes --multi, so match it here
        # to keep the runner and the checks.pre-commit gate in agreement (#778).
        args: [--allow-multiple-documents]
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  # YAML Linting
  - repo: https://github.com/adrienverge/yamllint
    rev: 81e9f98ffd059efe8aa9c1b1a42e5cce61b640c6  # v1.35.1
    hooks:
      - id: yamllint
        args: ["--format", "parsable", "--strict"]

  # Shellcheck
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a23f6b85d0fdd5bb9d564e2579e678033debbdff  # v0.10.0.1
    hooks:
      - id: shellcheck
        name: shellcheck
        args: ["-x"]
        exclude: ^\.envrc$

  # Markdown Linting (excludes auto-generated docs)
  # pymarkdown from the flake toolchain (vigos nix/pymarkdown.nix, devkit
  # #1170): the upstream pre-commit repo's native pyjson5 extension cannot load
  # on bare host runners (ImportError: libstdc++.so.6) — the exact failure this
  # repo's CI Lint job hit on the 1.6.0 migration PR.
  - repo: local
    hooks:
      - id: pymarkdown
        name: pymarkdown
        entry: pymarkdown
        language: system
        types: [markdown]
        args: ["-c", ".pymarkdown", "fix"]
        exclude: ^(README\.md|CONTRIBUTE\.md|TESTING\.md)

  # Justfile formatting — retired in #207 (devkit 1.6.0 migration).
  # `just --fmt` only ever formats the ROOT justfile, and that file is now
  # devkit-managed: it is not `just --fmt` stable, so the hook rewrote it on
  # every run, which both loses the managed content and trips CI's
  # scaffold-drift gate. Pointing it at `justfile.project` instead is no better
  # — `just --fmt` reflows multi-line recipe comment blocks (it treats only the
  # last comment line as the doc comment), mangling the comments this repo
  # relies on. Nothing is lost: with `pass_filenames: false` and no
  # `--justfile`, the hook never touched `justfile.project` anyway.

  # Rust formatting (fast — under 1s on a warm cache). Clippy is
  # NOT a pre-commit hook because it's too slow for every commit;
  # run `just lint` before push or `just verify` before opening a
  # PR. See #156.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false

  # Typo Linting (typos sourced from the flake dev-shell, like the devkit
  # template). The upstream hook installs a generic-linux binary that a NixOS
  # host cannot exec at all ("Could not start dynamically linked executable"),
  # so the hook is resolved from PATH instead — the flake provides it locally
  # and CI runs `just precommit` inside the same dev-shell. Refs #207.
  - repo: local
    hooks:
      - id: typos
        name: typos (source typo checker)
        entry: typos --force-exclude
        language: system
