---
# .pre-commit-config.yaml

exclude: ^.github_data/|^docs/issues/|^docs/pull-requests/

repos:
  # General Pre-commit Hooks (Fixes formatting issues)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      # Enforce topic branch naming:
      # - chore/<short_summary> (no issue required)
      # - <type>/<issue_number>-<short_summary> (for feature, bugfix, etc.)
      # - worktree/<issue_number> (autonomous worktree branches)
      # Allows main, dev, and branches matching the convention.
      - id: no-commit-to-branch
        name: branch-name (enforce <type>/<issue>-<summary>)
        args:
          - --branch
          - __none__  # override default so main/dev are not protected
          - --pattern
          - "^(?!main$)(?!dev$)(?!^(chore)/[a-z0-9]+(-[a-z0-9]+)*$)(?!^(feature|bugfix|hotfix|release|docs|test|refactor)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$)(?!^worktree/[0-9]+$).+$"
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
        # The JSONC scaffold files carry a `//` provenance banner (#1053) that
        # check-json's strict parser rejects; VS Code accepts it. Strict-JSON
        # files (renovate.json etc.) stay checked.
        exclude: (^|/)\.vscode/settings\.json$
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        # git-hooks.nix' check-yaml built-in hardcodes --multi, so match it here
        # to keep the runner and the checks.pre-commit gate in agreement (#778).
        args: [--allow-multiple-documents]
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  # YAML Linting
  - repo: https://github.com/adrienverge/yamllint
    rev: 81e9f98ffd059efe8aa9c1b1a42e5cce61b640c6  # v1.35.1
    hooks:
      - id: yamllint
        args: ["--format", "parsable", "--strict"]

  # Shellcheck (sourced from the flake dev-shell toolchain). The shellcheck-py
  # wheel bundles a manylinux shellcheck binary that a non-FHS userland cannot
  # exec, and the prek/uv installer cannot build that wheel under Python 3.14 —
  # so, like typos/pymarkdown, shellcheck runs as a language:system hook
  # resolved from the flake. Refs vig-os/devkit#778.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        # .envrc files are direnv stdlib scripts with no shebang; exclude them
        # from SC2148 at any path.
        args: ["-x"]
        exclude: (^|/)\.envrc$

  # >>> devkit:actionlint — excised when the actionlint feature is disabled (#1660)
  # GitHub Actions workflow linting (actionlint from the flake dev-shell
  # toolchain, like shellcheck above — both ship in devTools, so both resolve
  # from PATH in every mode). Lints this repo's own .github/workflows/ via
  # actionlint's auto-discovery, with its bundled shellcheck pass over `run:`
  # blocks enabled (#1003) so workflow scripts get the same lint as .sh files.
  #
  # Runner labels actionlint's built-in list does not know belong in
  # .github/actionlint.yaml (shipped alongside this config) — declare the label
  # there rather than loosening this hook. Refs #1660.
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint (lint GitHub Actions workflows)
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
  # <<< devkit:actionlint

  # Composite-action shell linting (vig-utils' shellcheck-composite-actions,
  # #1704). actionlint refuses a composite action outright (`unexpected key
  # "runs" for "workflow" section`) and has no composite mode, so every `run:`
  # body moved out of a workflow and into .github/actions/*/action.yml loses its
  # shellcheck pass. This hook reproduces actionlint's own recipe over those
  # bodies — same `${{ }}` neutralisation, same prelude, same exclude list — so
  # the two hooks gate one lint. shellcheck itself resolves from PATH (it ships
  # in devTools in every mode), like actionlint above.
  - repo: local
    hooks:
      - id: shellcheck-composite-actions
        name: shellcheck-composite-actions (lint composite action run bodies)
        entry: uv run shellcheck-composite-actions
        language: system
        files: (^|/)\.github/actions/[^/]+/action\.ya?ml$
        pass_filenames: true

  # Markdown Linting (excludes auto-generated docs)
  # pymarkdown from the flake toolchain (vigos nix/pymarkdown.nix, devkit
  # #1170): the upstream pre-commit repo's native pyjson5 extension cannot load
  # on bare host runners (ImportError: libstdc++.so.6) — the exact failure this
  # repo's CI Lint job hit on the 1.6.0 migration PR.
  - repo: local
    hooks:
      - id: pymarkdown
        name: pymarkdown
        entry: pymarkdown
        language: system
        types: [markdown]
        args: ["-c", ".pymarkdown", "fix"]
        exclude: ^(README\.md|CONTRIBUTE\.md|TESTING\.md)

  # Justfile formatting — retired in #207 (devkit 1.6.0 migration), still
  # retired at devkit 1.17.0 (rechecked in #228). `just --fmt` only ever
  # formats the ROOT justfile, and that file is devkit-managed: it is not
  # `just --fmt` stable at 1.17.0 either (verified by running `just --fmt
  # --unstable` in a fresh nix develop — it reflows the comment blocks around
  # `set shell` and around `with-native-libs`, both of which land in the
  # managed banner and trip the Scaffold Drift gate). Pointing it at
  # `justfile.project` instead is no better — `just --fmt` reflows multi-line
  # recipe comment blocks (it treats only the last comment line as the doc
  # comment), mangling the comments this repo relies on. Nothing is lost: with
  # `pass_filenames: false` and no `--justfile`, the hook never touched
  # `justfile.project` anyway. Revisit when devkit's shipped justfile becomes
  # `just --fmt` stable upstream.

  # Rust formatting (fast — under 1s on a warm cache). Clippy is
  # NOT a pre-commit hook because it's too slow for every commit;
  # run `just lint` before push or `just verify` before opening a
  # PR. See #156.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false

  # Nix formatting (nixfmt-rfc-style from the flake dev-shell toolchain). This
  # repo owns flake.nix, so nixfmt actually has real work to do — devkit ships
  # the hook (1.17.0 template) but consumers that don't own any .nix skip it.
  # Ships in the flake dev-shell packages so this language:system hook entry
  # resolves from PATH. Refs #228.
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt (format/check nix files)
        entry: nixfmt --check
        language: system
        files: \.nix$
        types: [file]

  # AI agent identity: strip trailers before commit-msg. Runs in the
  # prepare-commit-msg stage (via .githooks/prepare-commit-msg), so any
  # `Co-authored-by:` / `Assisted-by:` / `Generated-by: <agent>` line an
  # agent inserted gets removed before validate-commit-msg or the CI
  # blocklist ever see the message. Refs vig-os/devkit#163, #228.
  - repo: local
    hooks:
      - id: prepare-commit-msg-strip-trailers
        name: strip agent trailers from commit message
        entry: uv run prepare-commit-msg-strip-trailers
        language: system
        stages: [prepare-commit-msg]
        pass_filenames: true

  # AI agent identity: reject author/committer identities on the blocklist
  # (.github/agent-blocklist.toml). Matches the CI `commit-checks` gate so a
  # blocklisted identity fails locally at commit time, not only after push.
  # Refs vig-os/devkit#163, #228.
  - repo: local
    hooks:
      - id: check-agent-identity
        name: check agent identity
        entry: uv run check-agent-identity
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # Commit message validation (Conventional Commits + Refs: gate). Runs in the
  # commit-msg stage (via .githooks/commit-msg), so a message with a
  # non-conventional subject or a missing `Refs: #<n>` fails locally — the
  # devkit CI `validate-commit-range` job still catches anything that slips
  # through but the local hook makes it a fast typing error, not a push round
  # trip. Types + refs-optional-types mirror devkit 1.17.0's defaults resolved
  # from .vig-os (DEVKIT_COMMIT_TYPES / DEVKIT_REFS_OPTIONAL_TYPES both empty).
  # Refs vig-os/devkit#163, #228.
  - repo: local
    hooks:
      - id: validate-commit-msg
        name: validate commit message
        entry: uv run validate-commit-msg
        language: system
        stages: [commit-msg]
        args: [
          "--types", "feat,fix,docs,chore,refactor,perf,test,ci,build,revert,style",
          "--refs-optional-types", "chore",
          "--blocked-patterns", ".github/agent-blocklist.toml",
        ]

  # Typo Linting (typos sourced from the flake dev-shell, like the devkit
  # template). The upstream hook installs a generic-linux binary that a NixOS
  # host cannot exec at all ("Could not start dynamically linked executable"),
  # so the hook is resolved from PATH instead — the flake provides it locally
  # and CI runs `just precommit` inside the same dev-shell. Refs #207.
  - repo: local
    hooks:
      - id: typos
        name: typos (source typo checker)
        entry: typos --force-exclude
        language: system
